# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen generate
name: Doxi
options:
  bundleIdPrefix: com.doxi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""            # set your team to run on device
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    APP_GROUP_ID: group.com.doxi.app
packages:
  DoxiCore:
    path: DoxiCore
targets:
  Doxi:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: DoxiCore
        product: DoxiCore
      - package: DoxiCore
        product: DoxiReader
      - target: DoxiShare
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Doxi
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Doxi uses the camera to scan paper documents. Scans stay on your device.
        NSFaceIDUsageDescription: Doxi can lock your documents with Face ID.
        DoxiAppGroup: $(APP_GROUP_ID)
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
    entitlements:
      path: App/Doxi.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doxi.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  DoxiShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Doxi
        DoxiAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
    entitlements:
      path: ShareExtension/DoxiShare.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doxi.app.share
        TARGETED_DEVICE_FAMILY: "1,2"
  DoxiAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Doxi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Doxi:
    build:
      targets:
        Doxi: all
    test:
      targets:
        - DoxiAppTests
