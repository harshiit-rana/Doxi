name: CI

on:
  push:
  pull_request:

jobs:
  core-linux:
    name: DoxiCore tests + evaluation (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        working-directory: DoxiCore
        run: swift test
      - name: Extraction evaluation (temporary synthetic + holdout sets)
        working-directory: DoxiCore
        run: swift run doxi-eval ../Evaluation/datasets/synthetic-temporary ../Evaluation/datasets/synthetic-holdout --today 2026-09-24

  apple:
    name: iOS app build + tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: DoxiCore + DoxiReader (macOS)
        working-directory: DoxiCore
        run: swift build && swift test
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build and test app (unit + end-to-end UI tests in the simulator)
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          echo "Simulator: $SIM"
          xcodebuild -project Doxi.xcodeproj -scheme Doxi \
            -destination "platform=iOS Simulator,name=$SIM" \
            CODE_SIGNING_ALLOWED=NO test > xcodebuild.log 2>&1 || STATUS=$?
          echo "::group::Build warnings in Doxi sources"
          grep -E "^/.*/(App|ShareExtension|DoxiCore)/.*warning:" xcodebuild.log | sort -u | head -100 || true
          echo "::endgroup::"
          echo "::group::Test summary"
          grep -iE "Test Case '.*' (passed|failed)|error:|Executed [0-9]+ test" xcodebuild.log | grep -v "Capturing\|Checking" || true
          echo "::endgroup::"
          tail -60 xcodebuild.log
          exit ${STATUS:-0}
